<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2a78d6" />
    <meta name="description" content="EduFlow - l'espace numerique de travail qui aide vraiment a s'organiser." />
    <title>EduFlow</title>
    <script>
      // Applique le theme avant le premier rendu pour eviter tout flash.
      (() => {
        try {
          const t = localStorage.getItem("eduflow:theme") || "system";
          if (t !== "system") document.documentElement.dataset.theme = t;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
